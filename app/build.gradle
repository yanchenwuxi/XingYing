plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.xing.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.xing.tv"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.4.1"

        // Chaquopy 的 Python 解释器是预编译 so，只需声明 ABI，无需安装 NDK。
        // 仅输出 64 位（与主流手机一致，减小包体）。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            def ks = file("${rootProject.projectDir}/keystore/xingying.jks")
            if (ks.exists()) {
                storeFile ks
                storePassword project.findProperty("XING_STORE_PASS") ?: "xingying2026"
                keyAlias project.findProperty("XING_KEY_ALIAS") ?: "xingying"
                keyPassword project.findProperty("XING_KEY_PASS") ?: "xingying2026"
            }
        }
    }

    buildTypes {
        release {
            // R8 混淆 + 资源收缩；反射面已在 proguard-rules.pro 中显式保留
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests {
            // 单测跑在 JVM 上、未加载 Android 框架：
            // 让 android.util.Log 等桩方法返回默认值，而非抛 "not mocked"。
            returnDefaultValues = true
        }
    }
}

// py 源运行环境：脚本常用 requests/lxml/pyquery，打进 APK。
chaquopy {
    defaultConfig {
        version = "3.10"
        // CI 已 setup-python 3.10；本机无 3.10 时可改为 python3
        buildPython "python3.10"
        pyc {
            // 构建机若无 Python 则关闭字节码预编译，运行时再编译，不影响功能
            src = false
        }
        pip {
            install("requests")
            install("lxml")
            install("pyquery")
        }
    }
}

dependencies {
    // JS 引擎（Cash App QuickJS）与 HTML 选择器
    implementation 'app.cash.quickjs:quickjs-android:0.9.2'
    implementation 'org.jsoup:jsoup:1.17.2'
    // 兼容本地 libs（若存在）
    if (file('libs/quickjs.jar').exists()) {
        implementation files('libs/quickjs.jar')
    }
    if (file('libs/jsoup.jar').exists()) {
        implementation files('libs/jsoup.jar')
    }

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // 架构组件：ViewModel 承载页面数据，配置变化/后台切换时不重复拉取
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'

    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    testImplementation 'junit:junit:4.13.2'
}

// ---- 单元测试：非 ASCII 工程路径下的 classpath 规避 ----
// Gradle 8.x 把测试 worker 的 classpath 写进 @argfile 时固定使用 UTF-8，
// 而 JVM 按系统 ANSI 代码页（本机 GBK）解析该文件，二者不一致时中文路径
// 会被解成乱码，导致测试类 ClassNotFoundException（Gradle issue #30304，
// 9.7.0 才修复）。这里把 classpath 中的非 ASCII 条目镜像到系统临时目录后
// 再注入；工程路径本身为纯 ASCII 时该逻辑不产生任何改动。
tasks.withType(Test).configureEach { testTask ->
    testTask.doFirst {
        def nonAscii = { java.io.File f -> f.path.any { (it as char) > 127 } }
        def cp = testTask.classpath.files
        def bad = cp.findAll(nonAscii)
        if (bad.isEmpty()) return

        def mirrorRoot = new File(System.getProperty("java.io.tmpdir"), "xingying-test-cp")
        def mirrored = []
        bad.each { src ->
            // 无 Java 源时 javac 输出目录并不存在：直接从 classpath 移除，
            // 保留它也只会留下一条注定失效的非 ASCII 路径。
            if (!src.exists()) return

            // 目录名按「源路径哈希 + 原名」生成，不能用列表下标：
            // debug/release 两个测试任务的 kotlin-classes 目录原名相同，
            // 用下标会互相覆盖，留下陈旧镜像并触发 ClassNotFoundException。
            def key = Integer.toHexString(src.absolutePath.hashCode())
            def dst = new File(mirrorRoot, "${key}-${src.name.replaceAll('[^A-Za-z0-9._-]', '_')}")
            if (src.isDirectory()) {
                // 目录整体重建：项目自己的产物目录体量小，重拷比比对每个文件的 mtime 更可靠
                if (dst.exists()) dst.deleteDir()
                copy { from src; into dst }
            } else {
                def stale = !dst.exists() || dst.lastModified() < src.lastModified()
                if (stale) {
                    if (dst.exists()) dst.delete()
                    dst.parentFile.mkdirs()
                    dst.bytes = src.bytes
                }
            }
            mirrored << dst
        }
        testTask.classpath.setFrom(cp - bad.toSet() + mirrored)
    }
}